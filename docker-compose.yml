services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ${ENVFILE:-.env}
    environment:
      # Container-internal addresses override whatever the env file says: the
      # env file is written for running tests from the host, where these are
      # localhost. `environment` wins over `env_file` in compose.
      DATABASE_URL: postgresql+asyncpg://nocturn:nocturn@postgres:5432/nocturn
      REDIS_URL: redis://redis:6379/0
      DATABASE_SSL_REQUIRE: "false"
      LOG_FORMAT: json
      GIT_COMMIT: ${GIT_COMMIT:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only — a readiness check here would make compose consider the
      # container unhealthy during a database blip and restart a healthy process.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/livez', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["uv", "run", "python", "-m", "src.worker.main"]
    env_file: ${ENVFILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://nocturn:nocturn@postgres:5432/nocturn
      REDIS_URL: redis://redis:6379/0
      DATABASE_SSL_REQUIRE: "false"
      LOG_FORMAT: json
      GIT_COMMIT: ${GIT_COMMIT:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: ${ENVFILE:-.env}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nocturn
      POSTGRES_USER: nocturn
      POSTGRES_PASSWORD: nocturn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturn"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  nginx_certs:
