apiVersion: 1

providers:
  - name: nocturn
    orgId: 1
    folder: Nocturn
    type: file
    # Dashboards are code: edits made in the UI are overwritten on restart.
    # Export the JSON and commit it instead.
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
