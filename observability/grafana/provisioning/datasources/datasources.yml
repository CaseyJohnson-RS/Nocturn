apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Turns a request_id in a log line into a clickable filter, so you can go
      # from "this request was slow" straight to every line it produced.
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"([a-f0-9]+)"'
          datasourceUid: loki
          url: '${__value.raw}'
