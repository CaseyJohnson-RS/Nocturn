server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover every container in this compose project via the Docker socket, so
  # new services are picked up without touching this file.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      # The API and the worker log one JSON object per line; parse it so Grafana
      # shows structured fields instead of a wall of text.
      - json:
          expressions:
            level: level
            service: service
            logger: logger
            request_id: request_id
      # Only low-cardinality fields become labels. `request_id` stays a parsed
      # field — promoting it to a label would create one stream per request and
      # take Loki down.
      - labels:
          level:
          service:
