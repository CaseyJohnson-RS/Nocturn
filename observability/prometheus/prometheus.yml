global:
  # 15s is enough resolution for a service this size and keeps the local TSDB small.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    service: nocturn

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nocturn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: api

  - job_name: nocturn-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          component: worker

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: cache
