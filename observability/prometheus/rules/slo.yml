# SLI recording rules and multi-window multi-burn-rate alerts.
#
# The SLOs themselves (targets, windows, rationale) live in docs/SLO.md.
# Two SLOs are budget-based here:
#
#   availability : 99.5% of API requests are not 5xx   -> budget 0.5%
#   latency      : 99.0% of non-AI requests < 250 ms   -> budget 1.0%
#
# Both are expressed as an *error ratio* per window, so an alert is simply
# "the current ratio exceeds N x the budget", where N is the burn rate.
#
# Note on empty traffic: with zero requests the ratio is NaN, so alerts stay
# silent. That is deliberate — no traffic means no users are being hurt, and a
# dead service is caught by NocturnApiDown instead.

groups:
  - name: nocturn-sli-recording
    interval: 30s
    rules:
      # --- Availability error ratio, one rule per burn-rate window -----------
      - record: nocturn:availability:error_ratio5m
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[5m]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[5m]))

      - record: nocturn:availability:error_ratio30m
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[30m]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[30m]))

      - record: nocturn:availability:error_ratio1h
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[1h]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[1h]))

      - record: nocturn:availability:error_ratio6h
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[6h]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[6h]))

      - record: nocturn:availability:error_ratio2h
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[2h]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[2h]))

      - record: nocturn:availability:error_ratio1d
        expr: |
          sum(rate(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[1d]))
          /
          sum(rate(nocturn_http_requests_total{path!="<unmatched>"}[1d]))

      # 30-day compliance and remaining error budget, for the SLO dashboard.
      - record: nocturn:availability:error_ratio30d
        expr: |
          sum(increase(nocturn_http_requests_total{path!="<unmatched>",status=~"5.."}[30d]))
          /
          sum(increase(nocturn_http_requests_total{path!="<unmatched>"}[30d]))

      - record: nocturn:availability:budget_remaining_ratio
        expr: 1 - (nocturn:availability:error_ratio30d / 0.005)

      # --- Latency error ratio ----------------------------------------------
      # "Too slow" = slower than 250 ms. The threshold is pinned to a real
      # histogram bucket boundary; picking a value between buckets would silently
      # interpolate and make the SLI a guess.
      # AI endpoints are excluded: they are streamed and measured by TTFT instead.
      - record: nocturn:latency:error_ratio5m
        expr: |
          1 - (
            sum(rate(nocturn_http_request_duration_seconds_bucket{le="0.25",path!="<unmatched>",path!~"/api/ai/.*"}[5m]))
            /
            sum(rate(nocturn_http_request_duration_seconds_count{path!="<unmatched>",path!~"/api/ai/.*"}[5m]))
          )

      - record: nocturn:latency:error_ratio30m
        expr: |
          1 - (
            sum(rate(nocturn_http_request_duration_seconds_bucket{le="0.25",path!="<unmatched>",path!~"/api/ai/.*"}[30m]))
            /
            sum(rate(nocturn_http_request_duration_seconds_count{path!="<unmatched>",path!~"/api/ai/.*"}[30m]))
          )

      - record: nocturn:latency:error_ratio1h
        expr: |
          1 - (
            sum(rate(nocturn_http_request_duration_seconds_bucket{le="0.25",path!="<unmatched>",path!~"/api/ai/.*"}[1h]))
            /
            sum(rate(nocturn_http_request_duration_seconds_count{path!="<unmatched>",path!~"/api/ai/.*"}[1h]))
          )

      - record: nocturn:latency:error_ratio6h
        expr: |
          1 - (
            sum(rate(nocturn_http_request_duration_seconds_bucket{le="0.25",path!="<unmatched>",path!~"/api/ai/.*"}[6h]))
            /
            sum(rate(nocturn_http_request_duration_seconds_count{path!="<unmatched>",path!~"/api/ai/.*"}[6h]))
          )

      # --- Convenience series for dashboards ---------------------------------
      - record: nocturn:http_request_duration:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(nocturn_http_request_duration_seconds_bucket{path!="<unmatched>",path!~"/api/ai/.*"}[5m]))
          )

      - record: nocturn:llm_ttft:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(nocturn_llm_time_to_first_token_seconds_bucket[15m]))
          )

  - name: nocturn-slo-burn-rate
    rules:
      # Burn rate 14.4 => the full 30-day budget is gone in ~2 days.
      # The short window (5m) is required alongside the long one so the alert
      # resolves quickly once the burn stops, instead of hanging for an hour.
      - alert: NocturnAvailabilityBudgetBurnFast
        expr: |
          nocturn:availability:error_ratio1h > (14.4 * 0.005)
          and
          nocturn:availability:error_ratio5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Availability budget burning 14.4x — full 30d budget gone in ~2 days"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last hour."
          runbook_url: "https://github.com/CaseyJohnson-RS/Nocturn/blob/main/docs/runbooks/api-error-rate.md"

      # Burn rate 6 => budget exhausted in ~5 days.
      - alert: NocturnAvailabilityBudgetBurnSlow
        expr: |
          nocturn:availability:error_ratio6h > (6 * 0.005)
          and
          nocturn:availability:error_ratio30m > (6 * 0.005)
        for: 15m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Availability budget burning 6x — full 30d budget gone in ~5 days"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 6 hours."
          runbook_url: "https://github.com/CaseyJohnson-RS/Nocturn/blob/main/docs/runbooks/api-error-rate.md"

      # Burn rate 1 => on track to exactly exhaust the budget. Ticket, not page.
      - alert: NocturnAvailabilityBudgetBurnTicket
        expr: |
          nocturn:availability:error_ratio1d > (1 * 0.005)
          and
          nocturn:availability:error_ratio2h > (1 * 0.005)
        for: 1h
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "Availability budget on track to be fully consumed this window"
          runbook_url: "https://github.com/CaseyJohnson-RS/Nocturn/blob/main/docs/runbooks/api-error-rate.md"

      - alert: NocturnLatencyBudgetBurnFast
        expr: |
          nocturn:latency:error_ratio1h > (14.4 * 0.01)
          and
          nocturn:latency:error_ratio5m > (14.4 * 0.01)
        for: 5m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "Latency budget burning 14.4x — requests over 250 ms far above budget"
          description: "{{ $value | humanizePercentage }} of non-AI requests exceeded 250 ms."
          runbook_url: "https://github.com/CaseyJohnson-RS/Nocturn/blob/main/docs/runbooks/api-latency.md"

      - alert: NocturnLatencyBudgetBurnSlow
        expr: |
          nocturn:latency:error_ratio6h > (6 * 0.01)
          and
          nocturn:latency:error_ratio30m > (6 * 0.01)
        for: 15m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: "Latency budget burning 6x over the last 6 hours"
          runbook_url: "https://github.com/CaseyJohnson-RS/Nocturn/blob/main/docs/runbooks/api-latency.md"
