global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "slo"]
  # Wait a little before the first notification so a burst of related alerts
  # (api down -> dependency down -> burn rate) arrives as one message.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Pages interrupt a human: notify fast, remind often.
    - matchers: ['severity = "page"']
      receiver: pager
      group_wait: 10s
      repeat_interval: 1h

    # Tickets are looked at during working hours; do not re-notify hourly.
    - matchers: ['severity = "ticket"']
      receiver: tickets
      repeat_interval: 12h

inhibit_rules:
  # If the API is down, its burn-rate alerts are noise: same incident.
  - source_matchers: ['alertname = "NocturnApiDown"']
    target_matchers: ['severity =~ "page|ticket"']
    equal: ["env"]

  # A page for a given SLO suppresses the ticket-level alert for the same SLO.
  - source_matchers: ['severity = "page"']
    target_matchers: ['severity = "ticket"']
    equal: ["slo"]

receivers:
  - name: default

  # Local default is a no-op sink so the stack runs without any secrets.
  # To actually get notified, uncomment one block below and restart alertmanager.
