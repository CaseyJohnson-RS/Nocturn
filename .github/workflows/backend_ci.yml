name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/backend_ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps
        run: cd backend && uv sync

      - name: Lint
        run: make backend-lint

      - name: Tests (integration + unit)
        run: make backend-test-full ENVFILE=.env.example

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: |
          # A deploy hook that silently 4xx's looks exactly like a successful
          # deploy, so check the status code.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$RENDER_BACKEND_DEPLOY_HOOK")
          echo "Deploy hook returned $status"
          test "$status" -ge 200 -a "$status" -lt 300
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}

      - name: Wait for the new version to become ready
        run: |
          # Render restarts the service; poll readiness rather than sleeping a
          # fixed amount and hoping.
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 "$BACKEND_URL/readyz" | grep -q '"status":"ready"'; then
              echo "Ready after ${i} attempts"
              exit 0
            fi
            sleep 15
          done
          echo "Service did not become ready within 10 minutes"
          exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Smoke test
        run: BASE_URL="$BACKEND_URL" ./scripts/smoke-test.sh
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
