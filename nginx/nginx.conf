# Tune worker capacity. Each proxied request uses two connections
# (client<->nginx and nginx<->upstream), so worker_connections must be
# comfortably larger than the peak number of concurrent clients.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
}

http {
    upstream backend {
        server backend:8000;
        # Reuse upstream connections instead of opening a new one per request.
        keepalive 64;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Health probes. Deliberately proxied, unlike /metrics: an external
        # uptime check needs these, but the metrics endpoint stays reachable
        # only from inside the network (Prometheus scrapes backend:8000 direct).
        location ~ ^/(livez|readyz)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location /metrics {
            deny all;
            return 404;
        }

        # API and SSE
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable keepalive to the backend upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
